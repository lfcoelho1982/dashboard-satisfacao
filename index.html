<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard de Satisfação ATP - Estácio, Wyden & IDOMED</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 font-sans text-gray-800">
  <div class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md p-4">
      <div class="max-w-7xl mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-chart-line text-blue-400"></i>
          Pesquisa de Satisfação - Canais de Atendimento ATP
        </h1>
        <!-- Filtro Marca -->
        <select id="brandSelect" onchange="updateDashboard()" class="bg-slate-800 text-white text-sm rounded-lg p-2.5 border border-slate-700 focus:ring-blue-500 focus:border-blue-500">
          <option value="ALL">Todas as Marcas (Consolidado)</option>
          <option value="ESTACIO" selected>Estácio</option>
          <option value="WYDEN">Wyden</option>
          <option value="IDOMED">IDOMED</option>
        </select>
      </div>
    </header>

    <!-- Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
      <!-- KPI Cards -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
          <p class="text-xs font-semibold text-gray-500 uppercase">Total de Respostas</p>
          <p id="kpiTotal" class="text-3xl font-extrabold text-slate-800 mt-2">0</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
          <p class="text-xs font-semibold text-gray-500 uppercase">Média CSAT (0 a 5)</p>
          <p id="kpiCsat" class="text-3xl font-extrabold text-emerald-600 mt-2">0.00</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
          <p class="text-xs font-semibold text-gray-500 uppercase">% Satisfação (Notas 4 e 5)</p>
          <p id="kpiPercent" class="text-3xl font-extrabold text-blue-600 mt-2">0%</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
          <p class="text-xs font-semibold text-gray-500 uppercase">Atendimento Via Wpp/Presencial</p>
          <p id="kpiWpp" class="text-3xl font-extrabold text-indigo-600 mt-2">0%</p>
        </div>
      </div>

      <!-- Gráficos Principais -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
          <h2 class="text-sm font-bold text-gray-700 mb-4">Distribuição de Avaliação do Atendimento</h2>
          <div class="h-64"><canvas id="chartCsat"></canvas></div>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
          <h2 class="text-sm font-bold text-gray-700 mb-4">O que fez optar pelo canal?</h2>
          <div class="h-64"><canvas id="chartMotivos"></canvas></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const dataStore = {
      ESTACIO: { total: 35, csatAvg: 4.91, csatPct: 97.1, wppPct: 65.7, csatDist: [0,0,1,1,33], motivos: [23,6,4,2] },
      WYDEN: { total: 28, csatAvg: 5.00, csatPct: 100.0, wppPct: 53.6, csatDist: [0,0,0,0,28], motivos: [15,8,4,1] },
      IDOMED: { total: 1, csatAvg: 5.00, csatPct: 100.0, wppPct: 100.0, csatDist: [0,0,0,0,1], motivos: [1,0,0,0] }
    };

    let chartCsat, chartMotivos;

    function initCharts() {
      const ctx1 = document.getElementById('chartCsat').getContext('2d');
      chartCsat = new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: ['Nota 1', 'Nota 2', 'Nota 3', 'Nota 4', 'Nota 5'],
          datasets: [{ label: 'Qtd. Respostas', data: [], backgroundColor: '#3b82f6' }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      const ctx2 = document.getElementById('chartMotivos').getContext('2d');
      chartMotivos = new Chart(ctx2, {
        type: 'doughnut',
        data: {
          labels: ['WhatsApp Presencial', 'Presencial no Campus', 'Sem Canal Específico', 'Outros'],
          datasets: [{ data: [], backgroundColor: ['#10b981', '#6366f1', '#f59e0b', '#94a3b8'] }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      updateDashboard();
    }

    function updateDashboard() {
      const selected = document.getElementById('brandSelect').value;
      let total = 0, csatAvg = 0, csatPct = 0, wppPct = 0;
      let csatDist = [0,0,0,0,0], motivos = [0,0,0,0];

      if (selected === 'ALL') {
        const brands = Object.keys(dataStore);
        brands.forEach(b => {
          const d = dataStore[b];
          total += d.total;
          csatDist = csatDist.map((v, i) => v + d.csatDist[i]);
          motivos = motivos.map((v, i) => v + d.motivos[i]);
        });
        csatAvg = 4.95;
        csatPct = 98.4;
        wppPct = ((motivos[0] / total) * 100).toFixed(1);
      } else {
        const d = dataStore[selected];
        total = d.total;
        csatAvg = d.csatAvg;
        csatPct = d.csatPct;
        wppPct = d.wppPct;
        csatDist = d.csatDist;
        motivos = d.motivos;
      }

      document.getElementById('kpiTotal').innerText = total;
      document.getElementById('kpiCsat').innerText = csatAvg.toFixed(2);
      document.getElementById('kpiPercent').innerText = csatPct + '%';
      document.getElementById('kpiWpp').innerText = wppPct + '%';

      chartCsat.data.datasets[0].data = csatDist;
      chartCsat.update();

      chartMotivos.data.datasets[0].data = motivos;
      chartMotivos.update();
    }

    window.onload = initCharts;
  </script>
</body>
</html>
