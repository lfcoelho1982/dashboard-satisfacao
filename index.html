<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Pesquisa de Satisfação — ATP 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #0F0811;
  --bg-gradient: linear-gradient(135deg, #0F0811 0%, #1B0C1E 50%, #120815 100%);
  --panel-bg: linear-gradient(145deg, rgba(42, 18, 46, 0.75) 0%, rgba(22, 10, 25, 0.85) 100%);
  --panel-card: linear-gradient(135deg, rgba(50, 22, 54, 0.9) 0%, rgba(28, 12, 30, 0.95) 100%);
  --stroke: #522454;
  --stroke-soft: #301432;
  --text: #F8FAFC;
  --text-dim: #C4B5FD;
  --text-faint: #8B789C;
  --brand-primary: #E31C23;
  --brand-primary-grad: linear-gradient(135deg, #E31C23 0%, #B81419 100%);
  --brand-secondary: #A3125B;
  --brand-secondary-grad: linear-gradient(135deg, #C2186C 0%, #7A0C42 100%);
  --brand-accent: #FAA61A;
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --glow: rgba(227, 28, 35, 0.25);
}

body.theme-todas {
  --bg: #0A0F1D;
  --bg-gradient: linear-gradient(135deg, #0A0F1D 0%, #141B2D 50%, #0D1322 100%);
  --panel-bg: linear-gradient(145deg, rgba(20, 30, 50, 0.75) 0%, rgba(12, 18, 32, 0.85) 100%);
  --panel-card: linear-gradient(135deg, rgba(25, 38, 62, 0.9) 0%, rgba(15, 23, 38, 0.95) 100%);
  --stroke: #3B82F6;
  --stroke-soft: #1E293B;
  --text: #F8FAFC;
  --text-dim: #93C5FD;
  --text-faint: #64748B;
  --brand-primary: #3B82F6;
  --brand-primary-grad: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
  --brand-secondary: #6366F1;
  --brand-secondary-grad: linear-gradient(135deg, #6366F1 0%, #4338CA 100%);
  --brand-accent: #38BDF8;
  --glow: rgba(59, 130, 246, 0.25);
}

body.theme-estacio {
  --bg: #03141C;
  --bg-gradient: linear-gradient(135deg, #02111A 0%, #062433 50%, #0B3547 100%);
  --panel-bg: linear-gradient(145deg, rgba(11, 41, 56, 0.75) 0%, rgba(6, 28, 38, 0.85) 100%);
  --panel-card: linear-gradient(135deg, rgba(14, 53, 71, 0.9) 0%, rgba(8, 32, 44, 0.95) 100%);
  --stroke: #24AABC;
  --stroke-soft: #0B5E75;
  --text: #F0FDF4;
  --text-dim: #BFE0D7;
  --text-faint: #79C5BF;
  --brand-primary: #07BBE9;
  --brand-primary-grad: linear-gradient(135deg, #07BBE9 0%, #0288AD 100%);
  --brand-secondary: #24AABC;
  --brand-secondary-grad: linear-gradient(135deg, #24AABC 0%, #0E7490 100%);
  --brand-accent: #79C5BF;
  --glow: rgba(7,187,233,0.20);
}

body.theme-wyden {
  --bg: #180814;
  --bg-gradient: linear-gradient(135deg, #160712 0%, #270A1F 40%, #380C29 75%, #160611 100%);
  --panel-bg: linear-gradient(145deg, rgba(58, 13, 42, 0.65) 0%, rgba(30, 8, 23, 0.85) 100%);
  --panel-card: linear-gradient(135deg, rgba(74, 18, 52, 0.8) 0%, rgba(42, 10, 31, 0.92) 100%);
  --stroke: #C0267D;
  --stroke-soft: #631242;
  --text: #FFF5F8;
  --text-dim: #FBCFE8;
  --text-faint: #FF9E8B;
  --brand-primary: #FF7A66;
  --brand-primary-grad: linear-gradient(135deg, #FF7A66 0%, #C0267D 100%);
  --brand-secondary: #C0267D;
  --brand-secondary-grad: linear-gradient(135deg, #C0267D 0%, #8B1E61 100%);
  --brand-accent: #FFB74D;
  --glow: rgba(255, 122, 102, 0.25);
}

body.theme-idomed {
  --bg: #031312;
  --bg-gradient: linear-gradient(135deg, #020F0E 0%, #072624 50%, #0A3F3C 100%);
  --panel-bg: linear-gradient(145deg, rgba(10, 63, 60, 0.7) 0%, rgba(5, 33, 31, 0.85) 100%);
  --panel-card: linear-gradient(135deg, rgba(15, 79, 75, 0.85) 0%, rgba(7, 42, 40, 0.95) 100%);
  --stroke: #0F9B8E;
  --stroke-soft: #0A3F3C;
  --text: #F0FAF9;
  --text-dim: #99F6E4;
  --text-faint: #5EEAD4;
  --brand-primary: #0F9B8E;
  --brand-primary-grad: linear-gradient(135deg, #2DD4BF 0%, #0F9B8E 100%);
  --brand-secondary: #65D3C8;
  --brand-secondary-grad: linear-gradient(135deg, #65D3C8 0%, #0D9488 100%);
  --brand-accent: #FB923C;
  --glow: rgba(15,155,142,0.22);
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{
  background: var(--bg-gradient);
  color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  transition: background 0.4s ease, color 0.4s ease;
  min-height:100vh; padding-bottom:60px;
}

::selection{background:var(--brand-primary); color:#000;}

::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-track{background:rgba(0,0,0,0.2);}
::-webkit-scrollbar-thumb{background:var(--stroke); border-radius:4px;}

.wrap{max-width:1380px; margin:0 auto; padding:0 28px;}

header.top{
  border-bottom:1px solid var(--stroke-soft);
  background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(10,14,23,0.85) 100%);
  padding:22px 0 0 0; position:sticky; top:0; z-index:50;
  backdrop-filter: blur(16px); transition: all 0.3s ease;
}
.top-row{display:flex; align-items:flex-start; justify-content:space-between; gap:24px; flex-wrap:wrap; padding-bottom:18px;}
.brand{display:flex; align-items:center; gap:14px;}
.brand-mark{
  width:46px; height:46px; border-radius:14px;
  background: var(--brand-primary-grad);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; color:#FFFFFF; font-size:22px;
  flex-shrink:0; box-shadow: 0 4px 16px var(--glow);
  transition: all 0.3s ease;
}
.brand h1{font-family:var(--font-display); font-size:21px; font-weight:700; letter-spacing:0.2px;}
.brand p{font-size:12px; color:var(--text-dim); margin-top:2px; font-family:var(--font-mono); letter-spacing:0.4px;}

.period-switch{display:flex; gap:6px; background:rgba(0,0,0,0.3); border:1px solid var(--stroke-soft); border-radius:12px; padding:4px;}
.period-switch button{
  font-family:var(--font-mono); font-size:12px; letter-spacing:0.5px; color:var(--text-dim);
  background:transparent; border:none; padding:8px 16px; border-radius:8px; cursor:pointer;
  transition:all .25s ease; text-transform:uppercase; font-weight:600;
  display:flex; align-items:center; gap:8px;
}
.period-switch button:hover{color:var(--text); background:rgba(255,255,255,0.05);}
.period-switch button.active{
  background: var(--brand-primary-grad); color:#FFFFFF;
  box-shadow: 0 4px 12px var(--glow);
}

nav.tabs{display:flex; gap:6px; border-bottom:1px solid var(--stroke-soft); margin-top:4px;}
nav.tabs button{
  font-family:var(--font-body); font-size:13.5px; font-weight:600; color:var(--text-faint);
  background:transparent; border:none; padding:12px 20px; cursor:pointer; position:relative; top:1px;
  border-bottom:2px solid transparent; transition:all .2s ease;
}
nav.tabs button:hover{color:var(--text-dim);}
nav.tabs button.active{color:var(--text); border-bottom-color:var(--brand-primary);}

main{padding-top:26px;}
section.view{display:none;}
section.view.active{display:block; animation:fade .35s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

.eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-faint); margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.eyebrow::before{content:''; width:16px; height:1px; background:var(--stroke); display:inline-block;}

.hero{display:grid; grid-template-columns:1.3fr 1fr; gap:20px; margin-bottom:22px;}
@media (max-width:920px){ .hero{grid-template-columns:1fr;} }

.hero-card{
  background: var(--panel-card);
  border:1px solid var(--stroke); border-radius:18px; padding:26px 28px; position:relative; overflow:hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}
.hero-card::after{
  content:''; position:absolute; right:-40px; top:-40px; width:220px; height:220px; border-radius:50%;
  background:radial-gradient(circle, var(--glow), transparent 70%); pointer-events:none;
}
.hero-label{font-family:var(--font-mono); font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.8px;}
.hero-value{
  font-family:var(--font-display); font-size:46px; font-weight:700; margin-top:8px;
  background: var(--brand-primary-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing:-0.5px; display:inline-block;
}
.hero-sub{display:flex; align-items:center; gap:10px; margin-top:10px; font-size:13px; color:var(--text-dim);}
.delta{font-family:var(--font-mono); font-weight:600; padding:4px 10px; border-radius:6px; font-size:12px; background:rgba(255,255,255,0.08); color:var(--text);}

.hero-split{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
.split-card{
  background: var(--panel-card); border:1px solid var(--stroke); border-radius:18px; padding:22px 24px; display:flex; flex-direction:column; justify-content:space-between;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
}
.split-card .hero-label{margin-bottom:8px;}
.split-card .hero-value{font-size:28px;}

.nps-legend-bar{
  background: var(--panel-bg); border: 1px solid var(--stroke); border-radius: 14px;
  padding: 14px 20px; margin-bottom: 22px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;
}
.nps-legend-title{font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-faint); font-weight: 600;}
.nps-legend-items{display: flex; gap: 16px; flex-wrap: wrap;}
.nps-item-tag{font-size: 12.5px; font-family: var(--font-body); display: flex; align-items: center; gap: 8px;}
.nps-dot{width: 10px; height: 10px; border-radius: 50%; display: inline-block;}
.nps-dot.promotor{background: linear-gradient(135deg, #10B981 0%, #059669 100%);}
.nps-dot.neutro{background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);}
.nps-dot.detrator{background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);}

.kpi-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-bottom:26px;}
@media (max-width:1050px){ .kpi-grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:550px){ .kpi-grid{grid-template-columns:1fr;} }

.kpi{
  background: var(--panel-card); border:1px solid var(--stroke-soft); border-radius:14px; padding:18px 20px;
  transition:all .25s ease; box-shadow: 0 4px 14px rgba(0,0,0,0.15);
}
.kpi:hover{border-color:var(--brand-primary); transform:translateY(-3px); box-shadow: 0 8px 20px var(--glow);}
.kpi-top{display:flex; justify-content:space-between; align-items:flex-start;}
.kpi-icon{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:15px; background:rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);}
.kpi .kpi-label{font-size:11.5px; color:var(--text-dim); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.5px;}
.kpi .kpi-value{font-family:var(--font-display); font-size:26px; font-weight:700; margin-top:8px;}
.kpi .kpi-foot{font-size:11.5px; color:var(--text-faint); margin-top:6px; display:flex; gap:6px; align-items:center;}

.grid-2{display:grid; grid-template-columns:1.15fr 1fr; gap:20px; margin-bottom:20px;}
@media (max-width:980px){ .grid-2{grid-template-columns:1fr;} }

.panel{background: var(--panel-bg); border:1px solid var(--stroke); border-radius:18px; padding:22px 24px; backdrop-filter: blur(12px);}
.panel-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px;}
.panel-title{font-family:var(--font-display); font-size:16px; font-weight:700;}
.panel-desc{font-size:12px; color:var(--text-faint); margin-top:2px;}
.chart-box{position:relative; height:280px;}
.chart-box.tall{height:360px;}

.funnel{display:flex; flex-direction:column; gap:12px; margin-top:6px;}
.funnel-row{display:grid; grid-template-columns:180px 1fr 90px; align-items:center; gap:14px;}
.funnel-label{font-size:12px; color:var(--text-dim); font-family:var(--font-mono); line-height:1.3;}
.funnel-track{height:34px; background:rgba(0,0,0,0.3); border-radius:8px; overflow:hidden; position:relative; border:1px solid var(--stroke-soft);}
.funnel-fill{height:100%; border-radius:8px; display:flex; align-items:center; padding-left:12px; font-family:var(--font-mono); font-size:12px; font-weight:700; color:#FFFFFF; transition:width 0.8s ease;}
.funnel-value{font-family:var(--font-mono); font-size:13px; text-align:right; color:var(--text-dim); font-weight:600;}
